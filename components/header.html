<script>
  // Bootstrap native theme toggle functionality
  function initializeThemeToggle() {
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    if (!themeToggle || !themeIcon) {
      console.warn('Theme toggle elements not found');
      return;
    }
    
    // Check for saved theme or default to dark
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);
    
    themeToggle.addEventListener('click', function(e) {
      e.preventDefault();
      const currentTheme = document.documentElement.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      localStorage.setItem('theme', newTheme);
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-bs-theme', theme);
      
      // Update theme icon with animation
      themeIcon.style.transform = 'scale(0.8)';
      setTimeout(() => {
        if (theme === 'light') {
          themeIcon.className = 'bi bi-moon-fill';
        } else {
          themeIcon.className = 'bi bi-sun-fill';
        }
        themeIcon.style.transform = 'scale(1)';
      }, 150);
    }
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeThemeToggle);
  } else {
    initializeThemeToggle();
  }

  // Add active class to current page
  document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const pageKey = currentPage.replace('.html', '');
    
    // Find the corresponding nav link
    const navLinks = document.querySelectorAll('.nav-link[data-page]');
    navLinks.forEach(link => {
      if (link.getAttribute('data-page') === pageKey) {
        link.classList.add('active');
      }
    });
  });

  // Add logo to page title
  document.addEventListener('DOMContentLoaded', function() {
    const logoFavicon = 'images/G4E-no-bg.png';
    const title = document.title;
    // Add favicon if not present
    if (!document.querySelector('link[rel="icon"]')) {
      const link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/png';
      link.href = logoFavicon;
      document.head.appendChild(link);
    }
    // Optionally, add emoji or text to title for visual effect
    if (!title.startsWith('🌍')) {
      document.title = '🌍 ' + title;
    }
  });
</script>
